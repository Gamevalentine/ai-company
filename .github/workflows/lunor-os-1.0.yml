name: Build LUNOR OS 1.0 ISO

on:
  push:
    branches:
      - build/lunor-os-1.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build LUNOR OS 1.0 in Debian 13
        shell: bash
        run: |
          set -euxo pipefail
          docker pull debian:13
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/lunor-os \
            debian:13 bash -lc '
              set -euxo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                live-build debootstrap squashfs-tools xorriso \
                isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin \
                mtools dosfstools ca-certificates
              chmod +x auto/config config/hooks/live/010-lunor-branding.hook.chroot \
                config/includes.chroot/usr/local/bin/lunor-first-login
              lb clean --purge || true
              lb config
              lb build 2>&1 | tee build.log
            '

      - name: Normalize ISO filename
        shell: bash
        run: |
          set -euxo pipefail
          cd lunor-os
          iso="$(find . -maxdepth 1 -type f \( -name '*.iso' -o -name '*.hybrid.iso' \) | head -n1)"
          test -n "$iso"
          mv "$iso" LUNOR-OS-1.0-amd64.iso
          sha256sum LUNOR-OS-1.0-amd64.iso | tee LUNOR-OS-1.0-amd64.iso.sha256
          ls -lh LUNOR-OS-1.0-amd64.iso

      - name: Verify hybrid ISO metadata
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            debian:13 bash -lc '
              apt-get update >/dev/null
              DEBIAN_FRONTEND=noninteractive apt-get install -y xorriso >/dev/null
              xorriso -indev /work/lunor-os/LUNOR-OS-1.0-amd64.iso \
                -report_el_torito plain
            '

      - name: Upload LUNOR OS 1.0
        uses: actions/upload-artifact@v4
        with:
          name: LUNOR-OS-1.0-amd64
          path: |
            lunor-os/LUNOR-OS-1.0-amd64.iso
            lunor-os/LUNOR-OS-1.0-amd64.iso.sha256
            lunor-os/build.log
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
