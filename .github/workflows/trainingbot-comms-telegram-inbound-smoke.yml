name: TrainingBot COMMS Telegram Inbound Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trainingbot-comms-telegram-inbound-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve Cloudflare account
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(curl -fsS https://api.cloudflare.com/client/v4/accounts             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             | jq -r '.result[0].id // empty')"
          test -n "$ACCOUNT_ID"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Install Wrangler
        working-directory: platform/telegram-comms-worker
        run: npm install --no-audit --no-fund

      - name: Health check
        run: |
          set -euo pipefail
          curl -fsS https://trainingbot-comms-telegram.ai-vn.workers.dev/health | tee health.json
          jq -e '.ok == true and .service == "trainingbot-comms-telegram"' health.json >/dev/null

      - name: Initialize Telegram inbound safely
        working-directory: platform/telegram-comms-worker
        run: |
          set -euo pipefail
          ADMIN_KEY="$(openssl rand -hex 32)"
          printf '%s' "$ADMIN_KEY" | npx wrangler secret put ADMIN_KEY >/dev/null
          sleep 8
          HTTP_CODE="$(curl -sS -o response.json -w '%{http_code}' https://trainingbot-comms-telegram.ai-vn.workers.dev/initialize             -H "Authorization: Bearer $ADMIN_KEY")"
          jq '{ok,bot_username,offset_initialized,discarded_backlog}' response.json
          test "$HTTP_CODE" = "200"
          jq -e '.ok == true and .bot_username == "TrainingBotCommsBot" and .offset_initialized == true' response.json >/dev/null
