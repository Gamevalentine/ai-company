name: ATLAS CEO Dispatch Bridge

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: aion-runtime-state
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event.issue.user.login == 'Gamevalentine' && startsWith(github.event.issue.title, '[ATLAS]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout runtime code
        uses: actions/checkout@v4
        with:
          ref: main
          path: app

      - name: Checkout encrypted runtime state
        uses: actions/checkout@v4
        with:
          ref: aion-runtime-state
          path: runtime-state

      - name: Parse and validate ATLAS request
        env:
          ISSUE_BODY: \${{ github.event.issue.body }}
          ISSUE_NUMBER: \${{ github.event.issue.number }}
          ISSUE_AUTHOR: \${{ github.event.issue.user.login }}
        run: |
          printf '%s' "$ISSUE_BODY" > atlas-issue-body.json
          node app/platform/atlas-issue-bridge.mjs parse \
            --body-file atlas-issue-body.json \
            --issue-number "$ISSUE_NUMBER" \
            --author "$ISSUE_AUTHOR" \
            --output atlas-task.json
          cat atlas-task.json

      - name: Decrypt runtime state
        env:
          AION_STATE_PRIVATE_KEY: \${{ secrets.AION_GITHUB_APP_PRIVATE_KEY }}
        run: |
          node app/platform/state-crypto.mjs decrypt \
            --input runtime-state/aion-state.enc.json \
            --output runtime-state/aion-state.tmp.json

      - name: ATLAS sends task to TB-01
        run: |
          PAYLOAD=$(jq -c '.' atlas-task.json)
          node app/platform/event-worker.mjs \
            --state runtime-state/aion-state.tmp.json \
            --type create_task \
            --payload "$PAYLOAD"

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull local AI model
        run: ollama pull qwen2.5:1.5b-instruct

      - name: TB-01 AI plans the task
        env:
          AION_LOCAL_MODEL: qwen2.5:1.5b-instruct
        run: |
          TASK_ID=$(jq -r '.task_id' atlas-task.json)
          node app/platform/ai-brains.mjs manager-plan \
            --state runtime-state/aion-state.tmp.json \
            --task-id "$TASK_ID"

      - name: DEV-TB-01 prepares sandbox queue
        run: |
          TASK_ID=$(jq -r '.task_id' atlas-task.json)
          node app/platform/ai-brains.mjs dev-queue \
            --state runtime-state/aion-state.tmp.json \
            --task-id "$TASK_ID" \
            --output atlas-dev-queue.json
          cat atlas-dev-queue.json

      - name: Create temporary TrainingBot GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: \${{ secrets.AION_GITHUB_APP_ID }}
          private-key: \${{ secrets.AION_GITHUB_APP_PRIVATE_KEY }}
          owner: Gamevalentine
          repositories: trainingbot-cloudflare

      - name: DEV-TB-01 executes Safe Executor
        env:
          GH_TOKEN: \${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          COUNT=$(jq 'length' atlas-dev-queue.json)
          test "$COUNT" -le 1
          if [ "$COUNT" -eq 0 ]; then
            echo "No DEV task to execute."
            exit 0
          fi

          ROW=$(jq -c '.[0]' atlas-dev-queue.json)
          TASK_ID=$(echo "$ROW" | jq -r '.task_id')
          OPERATION=$(echo "$ROW" | jq -r '.operation')

          case "$OPERATION" in
            validate-sandbox|compare-with-main) ;;
            *) echo "Denied operation: $OPERATION"; exit 1 ;;
          esac

          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run aion-safe-executor.yml \
            --repo Gamevalentine/trainingbot-cloudflare \
            --ref main \
            -f task_id="$TASK_ID" \
            -f operation="$OPERATION" \
            -f confirm="AION-SANDBOX"

          RUN_ID=""
          for i in $(seq 1 40); do
            RUN_ID=$(gh run list \
              --repo Gamevalentine/trainingbot-cloudflare \
              --workflow aion-safe-executor.yml \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,displayTitle,createdAt \
              --jq '.[] | select(.displayTitle | contains("'"$TASK_ID"'")) | select(.createdAt >= "'"$STARTED_AT"'") | .databaseId' | head -n 1 || true)
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 2
          done
          test -n "$RUN_ID"

          set +e
          gh run watch "$RUN_ID" --repo Gamevalentine/trainingbot-cloudflare --exit-status
          WATCH_EXIT=$?
          set -e

          gh run view "$RUN_ID" \
            --repo Gamevalentine/trainingbot-cloudflare \
            --json databaseId,status,conclusion,url,headSha,createdAt,updatedAt \
            --jq '.' > atlas-run.json

          CONCLUSION=$(jq -r '.conclusion // "failure"' atlas-run.json)
          if [ "$CONCLUSION" = "success" ]; then RESULT="PASS"; else RESULT="FAIL"; fi
          PAYLOAD=$(jq -c \
            --arg task_id "$TASK_ID" \
            --arg operation "$OPERATION" \
            --arg result "$RESULT" \
            '{
              task_id:$task_id,
              operation:$operation,
              result:$result,
              run_id:(.databaseId|tostring),
              run_url:.url,
              head_sha:.headSha,
              conclusion:.conclusion,
              created_at:.createdAt,
              updated_at:.updatedAt
            }' atlas-run.json)

          node app/platform/event-worker.mjs \
            --state runtime-state/aion-state.tmp.json \
            --type executor_result \
            --payload "$PAYLOAD"

          if [ "$WATCH_EXIT" -ne 0 ]; then
            echo "Safe Executor failed; QA will review FAIL evidence."
          fi

      - name: QA-TB-01 AI reviews evidence
        env:
          AION_LOCAL_MODEL: qwen2.5:1.5b-instruct
        run: |
          TASK_ID=$(jq -r '.task_id' atlas-task.json)
          node app/platform/ai-brains.mjs qa-review \
            --state runtime-state/aion-state.tmp.json \
            --task-id "$TASK_ID"

      - name: Create CEO return summary
        run: |
          TASK_ID=$(jq -r '.task_id' atlas-task.json)
          node app/platform/ai-brains.mjs summary \
            --state runtime-state/aion-state.tmp.json \
            --task-id "$TASK_ID" \
            --output atlas-result-summary.json
          node app/platform/atlas-issue-bridge.mjs render \
            --summary-file atlas-result-summary.json \
            --issue-number "\${{ github.event.issue.number }}" \
            --output atlas-result-comment.md
          cat atlas-result-summary.json

      - name: Encrypt updated runtime state
        env:
          AION_STATE_PRIVATE_KEY: \${{ secrets.AION_GITHUB_APP_PRIVATE_KEY }}
        run: |
          node app/platform/state-crypto.mjs encrypt \
            --input runtime-state/aion-state.tmp.json \
            --output runtime-state/aion-state.enc.json
          rm -f runtime-state/aion-state.tmp.json

      - name: Persist encrypted state
        run: |
          git -C runtime-state config user.name "AION Runtime"
          git -C runtime-state config user.email "aion-runtime@users.noreply.github.com"
          git -C runtime-state add aion-state.enc.json
          if ! git -C runtime-state diff --cached --quiet; then
            git -C runtime-state commit -m "runtime: ATLAS issue \${{ github.event.issue.number }}"
            git -C runtime-state push origin HEAD:aion-runtime-state
          fi

      - name: Return result to ATLAS mailbox
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          gh issue comment "\${{ github.event.issue.number }}" \
            --repo Gamevalentine/ai-company \
            --body-file atlas-result-comment.md

      - name: Upload bridge evidence
        uses: actions/upload-artifact@v4
        with:
          name: atlas-bridge-\${{ github.event.issue.number }}-\${{ github.run_id }}
          path: |
            atlas-task.json
            atlas-result-summary.json
            atlas-result-comment.md
          retention-days: 7
