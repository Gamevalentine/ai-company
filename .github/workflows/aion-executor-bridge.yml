name: AION Executor Bridge

on:
  push:
    paths:
      - '.github/workflows/aion-executor-bridge.yml'
  workflow_dispatch:
    inputs:
      task_id:
        description: AION task ID
        required: true
        default: AION-PILOT-001
      operation:
        description: Sandbox operation
        required: true
        default: validate-sandbox
        type: choice
        options:
          - validate-sandbox
          - compare-with-main

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest

    steps:
      - name: Create temporary GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AION_GITHUB_APP_ID }}
          private-key: ${{ secrets.AION_GITHUB_APP_PRIVATE_KEY }}
          owner: Gamevalentine
          repositories: trainingbot-cloudflare

      - name: Run TrainingBot Safe Executor
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TASK_ID: ${{ inputs.task_id || 'AION-AUTO-CHECK' }}
          OPERATION: ${{ inputs.operation || 'validate-sandbox' }}
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          gh workflow run aion-safe-executor.yml \
            --repo Gamevalentine/trainingbot-cloudflare \
            --ref main \
            -f task_id="$TASK_ID" \
            -f operation="$OPERATION" \
            -f confirm="AION-SANDBOX"

      - name: Collect TrainingBot executor result
        id: collect
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TASK_ID: ${{ inputs.task_id || 'AION-AUTO-CHECK' }}
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for i in $(seq 1 30); do
            RUN_ID=$(gh run list \
              --repo Gamevalentine/trainingbot-cloudflare \
              --workflow aion-safe-executor.yml \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,displayTitle,createdAt \
              --jq '.[] | select(.displayTitle | contains(env.TASK_ID)) | select(.createdAt >= env.STARTED_AT) | .databaseId' | head -n 1)
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 2
          done
          test -n "$RUN_ID"
          set +e
          gh run watch "$RUN_ID" --repo Gamevalentine/trainingbot-cloudflare --exit-status
          WATCH_EXIT=$?
          set -e
          gh run view "$RUN_ID" \
            --repo Gamevalentine/trainingbot-cloudflare \
            --json databaseId,status,conclusion,url,headSha,createdAt,updatedAt \
            --jq '{run_id:.databaseId,status,conclusion,run_url:.url,head_sha:.headSha,created_at:.createdAt,updated_at:.updatedAt}' \
            > executor-result.json
          cat executor-result.json
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          if [ "$WATCH_EXIT" -ne 0 ]; then exit "$WATCH_EXIT"; fi

      - name: Upload collected evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aion-bridge-result-${{ github.run_id }}
          path: executor-result.json
          if-no-files-found: warn
          retention-days: 7

      - name: Checkout runtime code
        if: always()
        uses: actions/checkout@v4
        with:
          ref: main
          path: app

      - name: Checkout durable runtime state
        if: always()
        uses: actions/checkout@v4
        with:
          ref: aion-runtime-state
          path: runtime-state

      - name: Persist executor result to durable state
        if: always()
        env:
          TASK_ID: ${{ inputs.task_id || 'AION-AUTO-CHECK' }}
          OPERATION: ${{ inputs.operation || 'validate-sandbox' }}
        run: |
          set -euo pipefail
          if [ ! -f executor-result.json ]; then
            echo "executor-result.json missing; no durable state update"
            exit 0
          fi
          CONCLUSION=$(jq -r '.conclusion // "failure"' executor-result.json)
          if [ "$CONCLUSION" = "success" ]; then RESULT="PASS"; else RESULT="FAIL"; fi
          PAYLOAD=$(jq -c \
            --arg task_id "$TASK_ID" \
            --arg operation "$OPERATION" \
            --arg result "$RESULT" \
            '. + {task_id:$task_id,operation:$operation,result:$result}' \
            executor-result.json)
          node app/platform/event-worker.mjs \
            --state runtime-state/aion-state.json \
            --type executor_result \
            --payload "$PAYLOAD"

      - name: Commit durable runtime state
        if: always()
        run: |
          git -C runtime-state config user.name "AION Runtime"
          git -C runtime-state config user.email "aion-runtime@users.noreply.github.com"
          git -C runtime-state add aion-state.json
          if git -C runtime-state diff --cached --quiet; then
            echo "No runtime state change."
            exit 0
          fi
          git -C runtime-state commit -m "runtime: executor result"
          git -C runtime-state push origin HEAD:aion-runtime-state
