name: AION Local AI Agent Pilot

on:
  push:
    paths:
      - '.github/workflows/aion-local-ai-pilot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aion-runtime-state
  cancel-in-progress: false

jobs:
  ai-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout runtime code
        uses: actions/checkout@v4
        with:
          ref: main
          path: app

      - name: Checkout encrypted runtime state
        uses: actions/checkout@v4
        with:
          ref: aion-runtime-state
          path: runtime-state

      - name: Install Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull free local AI model
        run: ollama pull qwen2.5:0.5b-instruct

      - name: Decrypt runtime state
        env:
          AION_STATE_PRIVATE_KEY: ${{ secrets.AION_GITHUB_APP_PRIVATE_KEY }}
        run: |
          node app/platform/state-crypto.mjs decrypt \
            --input runtime-state/aion-state.enc.json \
            --output runtime-state/aion-state.tmp.json

      - name: ATLAS creates natural-language AI pilot goal
        run: |
          node app/platform/ai-brains.mjs bootstrap \
            --state runtime-state/aion-state.tmp.json \
            --task-id AION-AI-PILOT-001

      - name: TB-01 AI understands goal and plans work
        env:
          AION_LOCAL_MODEL: qwen2.5:0.5b-instruct
        run: |
          node app/platform/ai-brains.mjs manager-plan \
            --state runtime-state/aion-state.tmp.json \
            --task-id AION-AI-PILOT-001

      - name: DEV-TB-01 prepares sandbox-only queue
        run: |
          node app/platform/ai-brains.mjs dev-queue \
            --state runtime-state/aion-state.tmp.json \
            --task-id AION-AI-PILOT-001 \
            --output ai-dev-queue.json
          cat ai-dev-queue.json

      - name: Create temporary TrainingBot GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AION_GITHUB_APP_ID }}
          private-key: ${{ secrets.AION_GITHUB_APP_PRIVATE_KEY }}
          owner: Gamevalentine
          repositories: trainingbot-cloudflare

      - name: DEV-TB-01 executes AI-planned sandbox task
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          COUNT=$(jq 'length' ai-dev-queue.json)
          test "$COUNT" -le 1
          if [ "$COUNT" -eq 0 ]; then
            echo "No new DEV task."
            exit 0
          fi

          ROW=$(jq -c '.[0]' ai-dev-queue.json)
          TASK_ID=$(echo "$ROW" | jq -r '.task_id')
          OPERATION=$(echo "$ROW" | jq -r '.operation')
          case "$OPERATION" in
            validate-sandbox|compare-with-main) ;;
            *) echo "Denied operation: $OPERATION"; exit 1 ;;
          esac

          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run aion-safe-executor.yml \
            --repo Gamevalentine/trainingbot-cloudflare \
            --ref main \
            -f task_id="$TASK_ID" \
            -f operation="$OPERATION" \
            -f confirm="AION-SANDBOX"

          RUN_ID=""
          for i in $(seq 1 40); do
            RUN_ID=$(gh run list \
              --repo Gamevalentine/trainingbot-cloudflare \
              --workflow aion-safe-executor.yml \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,displayTitle,createdAt \
              --jq '.[] | select(.displayTitle | contains("'"$TASK_ID"'")) | select(.createdAt >= "'"$STARTED_AT"'") | .databaseId' | head -n 1 || true)
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 2
          done
          test -n "$RUN_ID"

          set +e
          gh run watch "$RUN_ID" --repo Gamevalentine/trainingbot-cloudflare --exit-status
          WATCH_EXIT=$?
          set -e

          gh run view "$RUN_ID" \
            --repo Gamevalentine/trainingbot-cloudflare \
            --json databaseId,status,conclusion,url,headSha,createdAt,updatedAt \
            --jq '.' > ai-run.json

          CONCLUSION=$(jq -r '.conclusion // "failure"' ai-run.json)
          if [ "$CONCLUSION" = "success" ]; then RESULT="PASS"; else RESULT="FAIL"; fi
          PAYLOAD=$(jq -c \
            --arg task_id "$TASK_ID" \
            --arg operation "$OPERATION" \
            --arg result "$RESULT" \
            '{
              task_id:$task_id,
              operation:$operation,
              result:$result,
              run_id:(.databaseId|tostring),
              run_url:.url,
              head_sha:.headSha,
              conclusion:.conclusion,
              created_at:.createdAt,
              updated_at:.updatedAt
            }' ai-run.json)

          node app/platform/event-worker.mjs \
            --state runtime-state/aion-state.tmp.json \
            --type executor_result \
            --payload "$PAYLOAD"

          echo "executor_exit=$WATCH_EXIT" >> "$GITHUB_ENV"

      - name: QA-TB-01 AI independently reviews real evidence
        env:
          AION_LOCAL_MODEL: qwen2.5:0.5b-instruct
        run: |
          node app/platform/ai-brains.mjs qa-review \
            --state runtime-state/aion-state.tmp.json \
            --task-id AION-AI-PILOT-001

      - name: Create AI pilot summary
        run: |
          node app/platform/ai-brains.mjs summary \
            --state runtime-state/aion-state.tmp.json \
            --task-id AION-AI-PILOT-001 \
            --output aion-ai-pilot-summary.json
          cat aion-ai-pilot-summary.json

      - name: Enforce pilot success state
        run: |
          STATUS=$(jq -r '.status' aion-ai-pilot-summary.json)
          if [ "$STATUS" != "READY_FOR_CEO_REVIEW" ]; then
            echo "AI pilot did not reach CEO review: $STATUS"
            exit 1
          fi

      - name: Encrypt updated runtime state
        env:
          AION_STATE_PRIVATE_KEY: ${{ secrets.AION_GITHUB_APP_PRIVATE_KEY }}
        run: |
          node app/platform/state-crypto.mjs encrypt \
            --input runtime-state/aion-state.tmp.json \
            --output runtime-state/aion-state.enc.json
          rm -f runtime-state/aion-state.tmp.json

      - name: Persist encrypted AI state
        run: |
          git -C runtime-state config user.name "AION Runtime"
          git -C runtime-state config user.email "aion-runtime@users.noreply.github.com"
          git -C runtime-state add aion-state.enc.json
          if ! git -C runtime-state diff --cached --quiet; then
            git -C runtime-state commit -m "runtime: local AI agent pilot"
            git -C runtime-state push origin HEAD:aion-runtime-state
          fi

      - name: Upload AI pilot evidence
        uses: actions/upload-artifact@v4
        with:
          name: aion-local-ai-pilot-${{ github.run_id }}
          path: aion-ai-pilot-summary.json
          retention-days: 7
