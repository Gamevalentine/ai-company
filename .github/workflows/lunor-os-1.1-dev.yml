name: Validate LUNOR OS 1.1 development

on:
  push:
    branches:
      - build/lunor-os-1.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-visuals:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate SVG and QML assets
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin libxml2-utils qt6-declarative-dev-tools

          for f in \
            lunor-os/config/includes.chroot/usr/share/plymouth/themes/lunor/background.svg \
            lunor-os/config/includes.chroot/usr/share/plymouth/themes/lunor/logo.svg \
            lunor-os/config/includes.chroot/usr/share/plymouth/themes/lunor/wordmark.svg \
            lunor-os/config/includes.chroot/usr/share/plymouth/themes/lunor/loader.svg \
            lunor-os/config/includes.chroot/usr/share/sddm/themes/lunor/background.svg \
            lunor-os/config/includes.chroot/usr/share/sddm/themes/lunor/logo.svg \
            lunor-os/config/includes.chroot/usr/share/wallpapers/LUNOR/lockscreen.svg \
            lunor-os/config/includes.chroot/usr/share/wallpapers/LUNOR/lock-avatar.svg \
            lunor-os/config/includes.chroot/usr/share/wallpapers/LUNOR/lunor-wallpaper.svg \
            lunor-os/config/includes.chroot/usr/share/wallpapers/LUNOR/lunor-horizon.svg \
            lunor-os/config/includes.chroot/usr/share/wallpapers/LUNOR/lunor-silence.svg \
            lunor-os/config/includes.chroot/usr/share/icons/hicolor/scalable/apps/lunor.svg \
            lunor-os/config/includes.chroot/etc/calamares/branding/lunor/logo.svg \
            lunor-os/config/includes.chroot/etc/calamares/branding/lunor/welcome.svg \
            lunor-os/config/includes.chroot/etc/calamares/branding/lunor/slide.svg
          do
            xmllint --noout "$f"
            rsvg-convert "$f" -o /tmp/asset.png
            test -s /tmp/asset.png
          done

          qml='lunor-os/config/includes.chroot/usr/share/sddm/themes/lunor/Main.qml'
          qmlformat_bin="$(command -v qmlformat || true)"
          if [ -z "$qmlformat_bin" ] && [ -x /usr/lib/qt6/bin/qmlformat ]; then
            qmlformat_bin=/usr/lib/qt6/bin/qmlformat
          fi
          test -n "$qmlformat_bin"
          "$qmlformat_bin" "$qml" > /tmp/Main.formatted.qml
          test -s /tmp/Main.formatted.qml

  validate-system:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate release identity and theme wiring
        shell: bash
        run: |
          set -euxo pipefail
          osr='lunor-os/config/includes.chroot/etc/os-release'
          auto='lunor-os/auto/config'
          hook='lunor-os/config/hooks/live/010-lunor-branding.hook.chroot'
          first='lunor-os/config/includes.chroot/usr/local/bin/lunor-first-login'

          grep -q '^PRETTY_NAME="LUNOR OS 1.1"$' "$osr"
          grep -q '^VERSION_ID="1.1"$' "$osr"
          grep -q '^VERSION="1.1 (Aurora)"$' "$osr"
          grep -q -- '--image-name "LUNOR-OS-1.1"' "$auto"
          grep -q -- '--iso-volume "LUNOR_1_1"' "$auto"
          grep -q 'plymouth-set-default-theme lunor' "$hook"
          grep -q '^Current=lunor$' lunor-os/config/includes.chroot/etc/sddm.conf.d/20-lunor-theme.conf
          grep -q 'file:///usr/share/wallpapers/LUNOR/lockscreen.png' lunor-os/config/includes.chroot/etc/skel/.config/kscreenlockerrc
          grep -q 'plasma-apply-colorscheme Lunor' "$first"
          sh -n "$auto"
          sh -n "$hook"
          sh -n "$first"

  validate-installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate LUNOR installer and post-install cleanup
        shell: bash
        run: |
          set -euxo pipefail
          desktop='lunor-os/config/includes.chroot/usr/share/lunor/live/install-lunor.desktop'
          skel='lunor-os/config/includes.chroot/etc/skel/Desktop/install-lunor.desktop'
          hook='lunor-os/config/hooks/live/010-lunor-branding.hook.chroot'
          first='lunor-os/config/includes.chroot/usr/local/bin/lunor-first-login'
          brand='lunor-os/config/includes.chroot/etc/calamares/branding/lunor/branding.desc'

          grep -q '^Exec=/usr/bin/calamares-install-debian$' "$desktop"
          grep -q '^Name=Install LUNOR OS$' "$desktop"
          grep -q '^Icon=lunor$' "$desktop"
          grep -q '^Hidden=true$' "$skel"
          grep -q '/usr/share/lunor/live/install-lunor.desktop' "$first"
          grep -q 'rm -f.*install-lunor.desktop' "$first"
          grep -q '^componentName: lunor$' "$brand"
          grep -q 'productName: LUNOR OS' "$brand"
          grep -q 'bootloaderEntryName: LUNOR OS' "$brand"
          grep -q 'calamares-desktop-icon.desktop' "$hook"
          grep -q 'apt-get purge -y plasma-welcome' "$hook"

      - name: Verify Debian 13 installer wrapper
        shell: bash
        run: |
          set -euxo pipefail
          docker pull debian:13 >/dev/null
          docker run --rm debian:13 bash -lc '
            set -eux
            apt-get update >/dev/null
            DEBIAN_FRONTEND=noninteractive apt-get install -y calamares-settings-debian >/dev/null
            test -x /usr/bin/calamares-install-debian
            grep -q "/etc/fstab.orig.calamares" /usr/bin/calamares-install-debian
          '


  validate-animations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate LUNOR animation QML
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools

          qmlformat_bin="$(command -v qmlformat || true)"
          if [ -z "$qmlformat_bin" ] && [ -x /usr/lib/qt6/bin/qmlformat ]; then
            qmlformat_bin=/usr/lib/qt6/bin/qmlformat
          fi
          test -n "$qmlformat_bin"

          for qml in \
            lunor-os/config/includes.chroot/usr/share/sddm/themes/lunor/Main.qml \
            lunor-os/config/includes.chroot/usr/share/plasma/shells/org.lunor.shell/contents/lockscreen/LockScreen.qml \
            lunor-os/config/includes.chroot/usr/share/plasma/look-and-feel/org.lunor.desktop/contents/splash/Splash.qml
          do
            "$qmlformat_bin" "$qml" > /tmp/validated.qml
            test -s /tmp/validated.qml
          done

      - name: Validate animation timeline and localization wiring
        shell: bash
        run: |
          set -euxo pipefail
          login='lunor-os/config/includes.chroot/usr/share/sddm/themes/lunor/Main.qml'
          lock='lunor-os/config/includes.chroot/usr/share/plasma/shells/org.lunor.shell/contents/lockscreen/LockScreen.qml'
          welcome='lunor-os/config/includes.chroot/usr/share/plasma/look-and-feel/org.lunor.desktop/contents/splash/Splash.qml'
          ply='lunor-os/config/includes.chroot/usr/share/plymouth/themes/lunor/lunor.script'
          msg='lunor-os/config/includes.chroot/usr/local/libexec/lunor-plymouth-message'

          grep -q 'duration: 800' "$login"
          grep -q 'duration: 700' "$login"
          grep -q 'Chào mừng' "$login"
          grep -q 'Sign in to continue' "$login"

          grep -q 'Welcome back' "$lock"
          grep -q 'Chào mừng trở lại' "$lock"
          grep -q 'Unlock to continue' "$lock"

          grep -q 'Welcome to LUNOR OS' "$welcome"
          grep -q 'Chào mừng đến với LUNOR OS' "$welcome"
          grep -q 'Clean. Calm. Ready.' "$welcome"

          grep -q 't / 0.8' "$ply"
          grep -q '(t - 0.8) / 0.8' "$ply"
          grep -q '(t - 1.6) / 0.7' "$ply"
          grep -q '(t - 2.3) / 0.7' "$ply"
          grep -q 'Image.Text("LUNOR OS"' "$ply"

          grep -q "Đang khởi động" "$msg"
          grep -q "Starting" "$msg"
          test ! -e lunor-os/config/includes.chroot/etc/xdg/plasmashellrc
          grep -q 'onStageChanged' "$welcome"
          grep -q 'stage === 2' "$welcome"
          grep -q 'stage >= 5' "$welcome"
          sh -n "$msg"

      - name: Reject risky Plasma shell override
        shell: bash
        run: |
          set -euxo pipefail
          test ! -e lunor-os/config/includes.chroot/etc/xdg/plasmashellrc
          ! grep -R "ShellPackage=org.lunor.shell" lunor-os/config/includes.chroot/etc/xdg lunor-os/config/includes.chroot/etc/skel 2>/dev/null
