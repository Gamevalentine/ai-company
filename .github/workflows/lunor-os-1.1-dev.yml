name: Validate LUNOR OS 1.1 development

on:
  push:
    branches:
      - build/lunor-os-1.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-boot-theme:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate SVG boot assets
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin libxml2-utils
          dir='lunor-os/config/includes.chroot/usr/share/plymouth/themes/lunor'
          for f in background.svg logo.svg wordmark.svg loader.svg; do
            xmllint --noout "$dir/$f"
            rsvg-convert "$dir/$f" -o "/tmp/${f%.svg}.png"
            test -s "/tmp/${f%.svg}.png"
          done

      - name: Validate Plymouth theme wiring
        shell: bash
        run: |
          set -euxo pipefail
          dir='lunor-os/config/includes.chroot/usr/share/plymouth/themes/lunor'
          test -s "$dir/lunor.plymouth"
          test -s "$dir/lunor.script"
          grep -q '^ModuleName=script$' "$dir/lunor.plymouth"
          grep -q 'Plymouth.SetRefreshFunction' "$dir/lunor.script"
          grep -q 'plymouth-set-default-theme lunor' lunor-os/config/hooks/live/010-lunor-branding.hook.chroot
          grep -q '^librsvg2-bin$' lunor-os/config/package-lists/lunor.list.chroot

  validate-login-theme:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate SDDM assets
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin libxml2-utils qt6-declarative-dev-tools
          dir='lunor-os/config/includes.chroot/usr/share/sddm/themes/lunor'
          xmllint --noout "$dir/background.svg"
          xmllint --noout "$dir/logo.svg"
          rsvg-convert "$dir/background.svg" -o /tmp/lunor-login-background.png
          rsvg-convert "$dir/logo.svg" -o /tmp/lunor-login-logo.png
          test -s /tmp/lunor-login-background.png
          test -s /tmp/lunor-login-logo.png
          test -s "$dir/Main.qml"
          test -s "$dir/metadata.desktop"
          test -s "$dir/theme.conf"
          qmlformat_bin="$(command -v qmlformat || true)"
          if [ -z "$qmlformat_bin" ] && [ -x /usr/lib/qt6/bin/qmlformat ]; then
            qmlformat_bin=/usr/lib/qt6/bin/qmlformat
          fi
          test -n "$qmlformat_bin"
          "$qmlformat_bin" "$dir/Main.qml" > /tmp/Main.formatted.qml
          test -s /tmp/Main.formatted.qml

      - name: Validate SDDM theme wiring
        shell: bash
        run: |
          set -euxo pipefail
          cfg='lunor-os/config/includes.chroot/etc/sddm.conf.d/20-lunor-theme.conf'
          qml='lunor-os/config/includes.chroot/usr/share/sddm/themes/lunor/Main.qml'
          hook='lunor-os/config/hooks/live/010-lunor-branding.hook.chroot'
          grep -q '^Current=lunor$' "$cfg"
          grep -q 'sddm.login' "$qml"
          grep -q 'sddm.reboot' "$qml"
          grep -q 'sddm.powerOff' "$qml"
          grep -q 'SDDM_DIR=/usr/share/sddm/themes/lunor' "$hook"
          grep -q 'background.png' "$hook"
          grep -q 'logo.png' "$hook"


  validate-lockscreen-theme:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate lock-screen assets
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin libxml2-utils
          dir='lunor-os/config/includes.chroot/usr/share/wallpapers/LUNOR'
          xmllint --noout "$dir/lockscreen.svg"
          xmllint --noout "$dir/lock-avatar.svg"
          rsvg-convert "$dir/lockscreen.svg" -o /tmp/lunor-lockscreen.png
          rsvg-convert "$dir/lock-avatar.svg" -o /tmp/lunor-lock-avatar.png
          test -s /tmp/lunor-lockscreen.png
          test -s /tmp/lunor-lock-avatar.png

      - name: Validate KScreenLocker wiring
        shell: bash
        run: |
          set -euxo pipefail
          sys='lunor-os/config/includes.chroot/etc/xdg/kscreenlockerrc'
          skel='lunor-os/config/includes.chroot/etc/skel/.config/kscreenlockerrc'
          hook='lunor-os/config/hooks/live/010-lunor-branding.hook.chroot'
          first='lunor-os/config/includes.chroot/usr/local/bin/lunor-first-login'

          grep -q '^WallpaperPlugin=org.kde.image$' "$sys"
          grep -q '^WallpaperPlugin=org.kde.image$' "$skel"
          grep -q 'Image=file:///usr/share/wallpapers/LUNOR/lockscreen.png' "$sys"
          grep -q 'Image=file:///usr/share/wallpapers/LUNOR/lockscreen.png' "$skel"
          grep -q 'lockscreen.svg' "$hook"
          grep -q 'lock-avatar.svg' "$hook"
          grep -q '/usr/share/pixmaps/lunor-avatar.png' "$hook"
          grep -q 'kwriteconfig6 --file kscreenlockerrc' "$first"
          grep -q 'file:///usr/share/wallpapers/LUNOR/lockscreen.png' "$first"


  validate-desktop-theme:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate desktop wallpaper set
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin libxml2-utils
          dir='lunor-os/config/includes.chroot/usr/share/wallpapers/LUNOR'
          for name in lunor-wallpaper lunor-horizon lunor-silence; do
            xmllint --noout "$dir/$name.svg"
            rsvg-convert "$dir/$name.svg" -o "/tmp/$name.png"
            test -s "/tmp/$name.png"
          done

      - name: Validate LUNOR color scheme and defaults
        shell: bash
        run: |
          set -euxo pipefail
          colors='lunor-os/config/includes.chroot/usr/share/color-schemes/Lunor.colors'
          globals='lunor-os/config/includes.chroot/etc/skel/.config/kdeglobals'
          first='lunor-os/config/includes.chroot/usr/local/bin/lunor-first-login'
          hook='lunor-os/config/hooks/live/010-lunor-branding.hook.chroot'

          grep -q '^ColorScheme=Lunor$' "$colors"
          grep -q '^Name=LUNOR$' "$colors"
          grep -q '^DecorationFocus=158,201,255$' "$colors"
          grep -q '^ColorScheme=Lunor$' "$globals"
          grep -q '^AccentColor=158,201,255$' "$globals"
          grep -q '^accentColorFromWallpaper=false$' "$globals"
          grep -q 'plasma-apply-wallpaperimage' "$first"
          grep -q 'plasma-apply-colorscheme Lunor' "$first"
          grep -q 'accent-color "#9EC9FF"' "$first"
          grep -q 'lunor-wallpaper lunor-horizon lunor-silence' "$hook"
          sh -n "$first"
          sh -n "$hook"
