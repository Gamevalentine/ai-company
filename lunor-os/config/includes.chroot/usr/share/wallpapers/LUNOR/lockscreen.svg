<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02050A"/>
      <stop offset=".48" stop-color="#071325"/>
      <stop offset="1" stop-color="#02050A"/>
    </linearGradient>
    <radialGradient id="aurora" cx="50%" cy="38%" r="58%">
      <stop offset="0" stop-color="#2A5A91" stop-opacity=".34"/>
      <stop offset=".32" stop-color="#17365C" stop-opacity=".18"/>
      <stop offset="1" stop-color="#02050A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="foldGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F8FF" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#CFE3FF" stop-opacity=".88"/>
      <stop offset="1" stop-color="#9EC9FF" stop-opacity=".80"/>
    </linearGradient>
    <filter id="blur" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#aurora)"/>

  <!-- restrained light ribbons -->
  <path d="M-180 900 L760 -40 L1080 -40 L100 1080 Z" fill="#9EC9FF" opacity=".025"/>
  <path d="M780 1080 L1760 80 L2030 270 L1160 1080 Z" fill="#9EC9FF" opacity=".028"/>

  <!-- LUNOR Fold halo -->
  <g transform="translate(960 292)">
    <path d="M0 -84 L72 -42 L72 40 L0 94 L-72 52 L-72 -36 Z"
          fill="#9EC9FF" opacity=".12" filter="url(#blur)"/>
    <path d="M-67 -40 L-6 -77 L65 -39 L4 -4 Z" fill="url(#foldGlow)" opacity=".92"/>
    <path d="M-67 -40 L4 -4 L4 75 L-67 37 Z" fill="#EAF3FF" opacity=".90"/>
    <path d="M4 -4 L65 -39 L65 34 L4 75 Z" fill="#A9D0FF" opacity=".86"/>
    <path d="M-40 -27 L3 -51 L38 -31 L1 -10 Z" fill="#02050A" opacity=".72"/>
    <path d="M-40 -27 L1 -10 L1 39 L-40 17 Z" fill="#071325" opacity=".80"/>
    <path d="M1 -10 L38 -31 L38 13 L1 39 Z" fill="#0A1324" opacity=".88"/>
  </g>

  <!-- keep auth area visually quiet -->
  <ellipse cx="960" cy="690" rx="430" ry="250" fill="#02050A" opacity=".10"/>
</svg>
