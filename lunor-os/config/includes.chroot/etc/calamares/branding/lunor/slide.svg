      <stop offset="0" stop-color="#02050A"/>
      <stop offset=".55" stop-color="#071325"/>
      <stop offset="1" stop-color="#02050A"/>
    </linearGradient>
    <radialGradient id="aura" cx="72%" cy="42%" r="62%">
      <stop offset="0" stop-color="#315F96" stop-opacity=".40"/>
      <stop offset=".36" stop-color="#17365C" stop-opacity=".18"/>
